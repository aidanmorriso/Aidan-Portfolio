<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music // AIDAN.V2</title>
    <meta name="description" content="Aidan Morrison — IT, hardware, DIY. Transmitting from Titahi Bay.">
    <meta name="theme-color" content="#05030a">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
    <script src="js/music.js" defer></script>
</head>
<body>
<main>
<div style="height:2rem"></div>
<section class="transmission">
    <span class="sticker acid">88.8 FM</span>
    <div class="tx-head"><span>From: Aidan Morrison</span><span class="freq">◉ 102.1 MHz</span><span>To: Listeners</span></div>
    <h2 class="tx-title">Pirate Radio <span class="ransom">live</span></h2>
    <p>The fuel that keeps the ship moving. High-energy beats for the workshop, darker stuff for late-night sessions.</p>
    <div class="deck">
        <div class="deck-now" id="now-playing">◉ STANDBY — pick a track</div>
        <canvas id="visualizer" width="900" height="130"></canvas>
        <audio id="audio" preload="none"></audio>
        <div class="deck-row">
            <span class="deck-time" id="t-cur">0:00</span>
            <input type="range" id="seek" class="slider" min="0" max="100" step="0.1" value="0" aria-label="Seek">
            <span class="deck-time" id="t-tot">0:00</span>
        </div>
        <div class="deck-row">
            <button class="btn small" id="b-prev" aria-label="Previous">|◄◄</button>
            <button class="btn small alt" id="b-play">PLAY</button>
            <button class="btn small" id="b-next" aria-label="Next">►►|</button>
            <button class="btn small" id="b-shuf">SHUF: OFF</button>
            <span class="deck-time" style="margin-left:auto">VOL</span>
            <input type="range" id="vol" class="slider" min="0" max="1" step="0.01" value="0.8" style="max-width:140px" aria-label="Volume">
        </div>
        <div class="playlist"><input type="search" id="filter" placeholder="search the crates…" aria-label="Filter tracks"><ul id="playlist" style="list-style:none"></ul></div>
    </div>
</section>
</main>
</body>
</html>
